name: Validate config

# The app reads raw.githubusercontent.com directly, so a push to main is already the publish and
# there is nothing here to deploy. This runs after the fact: it cannot hold a bad file back, only
# tell you one went out. A red run means fix it now — see "Invalid JSON now goes live" in README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every .json in the tree, found rather than listed. This was a fixed list of the four files
      # the full edition serves, which silently stopped covering everything the moment Mediagg
      # Personal got its own personal/ tree — and an unvalidated file here is worse than elsewhere,
      # because the app writes a fetched config to disk before parsing it, so invalid JSON that
      # returns 200 overwrites the last good copy on every device.
      - name: Validate JSON
        run: |
          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            python3 -m json.tool "$f" > /dev/null \
              || { echo "::error file=$f::$f is not valid JSON and is being served right now"; exit 1; }
            echo "  ok  $f"
          done < <(find . -name '*.json' -not -path './.git/*' | sort)
          test "$found" -gt 0 || { echo "::error::no .json file was found to validate"; exit 1; }
          echo "$found file(s) valid"
